name: Linters
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7

        - name: Setup uv
          uses: astral-sh/setup-uv@v7

        - name: Run ruff check
          run: uv run ruff check .

        - name: Run ruff format check
          run: uv run ruff format --check .
